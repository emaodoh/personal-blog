<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="{{url_for('static', filename='admin.css')}}">

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            MyBlog Admin
        </div>


        <ul>

            <li>
                <a href="{{ url_for('admin_dashboard') }}">
                    Dashboard
                </a>
            </li>


            <li>
                <a href="{{url_for('add_blog')}}" class="add-btn">
                    + Add Blog
                </a>
            </li>


            <li>
                <a href="{{url_for('home')}}">
                    View Blog
                </a>
            </li>


            <li>
                <a href="{{url_for('home')}}">
                    Logout
                </a>
            </li>


        </ul>


    </nav>


</header>




<section class="dashboard">


    <div class="heading">

        <h1>
            Blog Management
        </h1>

        <p>
            Create, edit and manage your articles.
        </p>

    </div>


    {% for article in articles %}
    <div class="blog-container">



        <div class="blog-card">


        
            
            <h2>
                {{ article["title"] }}
            </h2>

            


            <div class="actions">


                <a href="{{url_for ('edit_blog', article_id=article['id'])}}" class="edit">
                    Edit
                </a>


                <a href="{{url_for('delete_blog', article_id=article['id'])}}" class="delete">
                    Delete
                </a>
        

            </div>


        </div>





        

        </div>



    </div>

    {% endfor %}

</section>




<footer>

    <p>
        © 2026 MyBlog Admin Panel
    </p>

</footer>



</body>

</html>
